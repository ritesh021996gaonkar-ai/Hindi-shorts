name: Daily Hindi Shorts

on:
  schedule:
    - cron: "30 20 * * *"   # 02:00 AM IST every day
  workflow_dispatch:         # "Run workflow" button for manual/test runs
    inputs:
      count:
        description: "How many videos"
        default: "5"
      upload:
        description: "Upload to YouTube? (yes/no)"
        default: "yes"

permissions:
  contents: write            # lets it save data/history.json (no repeated topics)

concurrency: daily-shorts

jobs:
  make-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and Hindi font
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-noto-core

      - run: pip install -r requirements.txt

      - name: Make and upload shorts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # optional settings (Settings > Secrets and variables > Actions > Variables)
          CHANNEL_NAME: ${{ vars.CHANNEL_NAME }}
          NICHE: ${{ vars.NICHE }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          REPLICATE_MODEL: ${{ vars.REPLICATE_MODEL }}
          REPLICATE_EXTRA: ${{ vars.REPLICATE_EXTRA }}
          AI_CLIPS_PER_VIDEO: ${{ vars.AI_CLIPS_PER_VIDEO }}
          VOICE: ${{ vars.VOICE }}
          POST_TIMES_IST: ${{ vars.POST_TIMES_IST }}
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH }}
        run: |
          ARGS="--count ${{ github.event.inputs.count || '5' }}"
          if [ "${{ github.event.inputs.upload }}" = "no" ]; then ARGS="$ARGS --no-upload"; fi
          python main.py $ARGS

      - name: Save topic history
        if: always()
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet || (git commit -m "history: $(date +%F)" && git push)

      - name: Keep videos for 3 days (download from the run page)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_number }}
          path: output/*.mp4
          retention-days: 3
          if-no-files-found: ignore
