name: Long Hindi Documentary

on:
  schedule:
    - cron: "30 20 * * 0,2,4"   # 02:00 AM IST on Mon, Wed, Fri (goes live 6 PM IST same day)
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to YouTube? (yes/no)"
        default: "yes"
      topic:
        description: "Topic (optional, e.g. हड़प्पा सभ्यता). Empty = bot chooses"
        default: ""
      minutes:
        description: "Length in minutes"
        default: "12"

permissions:
  contents: write

concurrency: long-video

jobs:
  make-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and Hindi font
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-noto-core

      - run: pip install -r requirements.txt

      - name: Make and upload the documentary
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
          KAGGLE_STEPS: ${{ vars.KAGGLE_STEPS }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          VOICE: ${{ vars.VOICE }}
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH }}
          LONG_NICHE: ${{ vars.LONG_NICHE }}
          LONG_SUBTITLES: ${{ vars.LONG_SUBTITLES }}
          LONG_PUBLISH_TIME_IST: ${{ vars.LONG_PUBLISH_TIME_IST }}
          LONG_TOPIC: ${{ github.event.inputs.topic }}
          LONG_MINUTES: ${{ github.event.inputs.minutes || vars.LONG_MINUTES }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.upload }}" = "no" ]; then ARGS="--no-upload"; fi
          python longform.py $ARGS

      - name: Save topic history
        if: always()
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add data/long_history.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "long history: $(date +%F)" && git pull --rebase -q && git push)

      - name: Publish preview images (branch "previews")
        if: always()
        run: |
          ls output/*.preview.jpg >/dev/null 2>&1 || exit 0
          mkdir -p /tmp/prev && cp output/*.preview.jpg output/long_work/script.json output/long_work/description.txt /tmp/prev/ 2>/dev/null || true
          cd /tmp/prev
          git init -q && git checkout -q -b previews
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add . && git commit -qm "long preview run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" previews

      - name: Keep the video for 3 days (download from the run page)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentary-${{ github.run_number }}
          path: |
            output/*.mp4
            output/long_work/thumbnail.jpg
            output/long_work/description.txt
          retention-days: 3
          if-no-files-found: ignore
